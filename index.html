<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">

<title>桌遊房</title>
<script>window.__BGR_VER='2026-11-22-1';/* 上載前一定要改版本號（日期-次數） */</script>
<style>
:root{--bg:#14121f;--bg2:#1c1930;--card:#252140;--card2:#302a52;--line:#433c70;--tx:#f6f3ff;--tx2:#d8d1f7;--gold:#ffd166;--gold2:#ffb534;--ok:#4fe0a0;--bad:#ff6b81;--jd:#86bcff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 50% -10%,#2b2152 0%,var(--bg) 60%)}
#app{height:var(--app-h,100vh);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 28px)}
.scr{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.btn{display:block;width:100%;padding:15px 14px;border-radius:14px;background:var(--card2);font-size:17px;font-weight:700;margin:10px 0;transition:transform .08s;text-align:center}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2b1b00}
.btn.ok{background:var(--ok);color:#052a1a}
.btn.bad{background:var(--bad);color:#2e0710}
.btn.line{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn.big{font-size:19px;padding:17px 14px}
.btn[disabled]{opacity:.42;pointer-events:none}
.row{display:flex;gap:10px}
.row>.btn{flex:1;min-width:0}
/* 主頁 */
.home{text-align:center;padding-top:14px}
.logo{width:92px;height:92px;margin:6px auto 4px}
.home h1{margin:4px 0 2px;font-size:34px;letter-spacing:4px}
.by{font-size:14px;color:var(--tx2);margin-bottom:22px}
.lbl{display:block;text-align:left;font-size:15px;font-weight:700;margin:6px 2px}
.inp{width:100%;font:inherit;font-size:19px;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg2);color:var(--tx);outline:none}
.inp:focus{border-color:var(--gold)}
.sec{text-align:left;font-size:15px;font-weight:700;margin:24px 2px 6px}
.game{background:linear-gradient(160deg,#2c2552,#211d3b);border-radius:20px;padding:16px;text-align:left;box-shadow:0 8px 24px #0006,inset 0 0 0 1px #ffffff10}
.gh{display:flex;align-items:center;gap:12px}
.gi{width:52px;height:52px;border-radius:14px;background:linear-gradient(150deg,var(--gold),#ff8a5b);color:#2b1400;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);flex:none}
.gn{font-size:22px;font-weight:800}
.gm{font-size:14px;color:var(--tx2);margin-top:2px}
.gd{font-size:15px;line-height:1.55;margin:12px 0 4px;color:var(--tx)}
.more{margin-top:14px;font-size:14px;color:var(--tx2)}
.ver{margin-top:26px;font-size:12px;color:#a59dd0}
/* 頂部 */
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ib{padding:9px 13px;border-radius:12px;background:var(--card);font-size:15px;font-weight:700;flex:none}
.ib:active{transform:scale(.95)}
.tt{flex:1;text-align:center;font-size:15px;color:var(--tx2)}
.tt b{color:var(--gold);font-size:19px;letter-spacing:2px}
#banner{display:none;margin:-2px 0 10px;padding:10px 12px;border-radius:12px;background:#5a2333;color:#ffd9e0;font-size:14px;font-weight:700;line-height:1.4}
#banner.show{display:block}
/* 房間 */
.code{background:var(--card);border-radius:20px;padding:16px;text-align:center;box-shadow:inset 0 0 0 1px #ffffff12}
.code .k{font-size:15px;color:var(--tx2)}
.code .n{font-size:56px;font-weight:900;letter-spacing:12px;color:var(--gold);margin:2px 0 4px 12px;font-variant-numeric:tabular-nums}
.code .h{font-size:14px;color:var(--tx2);margin-bottom:2px;line-height:1.45}
.code .row .btn{margin:10px 0 0;padding:11px;font-size:15px}
.h2{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:800;margin:20px 2px 8px}
.h2 small{font-size:14px;font-weight:700;color:var(--tx2)}
.list{background:var(--card);border-radius:18px;padding:4px 10px}
.pr{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #ffffff10;min-height:56px}
.pr:last-child{border-bottom:0}
.pr.me .nm{color:var(--gold)}
.pr.off{opacity:.5}
.av{width:36px;height:36px;border-radius:50%;background:var(--c,#888);color:#1a1530;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 -3px 0 #0003}
.nm{flex:1;min-width:0;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.no{width:22px;text-align:center;font-weight:900;color:var(--tx2);flex:none}
.tag{font-size:13px;font-weight:800;padding:4px 8px;border-radius:999px;background:#ffffff14;flex:none}
.tag.host{background:#ffd16626;color:var(--gold)}
.tag.bad{background:#ff6b8126;color:var(--bad)}
.tag.ok{background:#4fe0a026;color:var(--ok)}
.tag.jd{background:#86bcff26;color:var(--jd)}
.x{width:36px;height:36px;border-radius:50%;background:#ffffff10;font-size:18px;font-weight:800;flex:none}
.sb{padding:9px 12px;border-radius:11px;font-size:15px;font-weight:800;flex:none}
.sb.bad{background:#ff6b8126;color:var(--bad)}
.sb.pri{background:var(--gold);color:#2b1b00}
.sb:active{transform:scale(.95)}
.seg{display:flex;gap:6px;background:var(--bg2);border-radius:14px;padding:5px;margin:4px 0 12px}
.seg button{flex:1;padding:10px 2px;border-radius:10px;font-size:15px;font-weight:700;min-width:0}
.seg button.on{background:var(--gold);color:#2b1b00}
.seg.ro button{pointer-events:none}
.seg.ro button:not(.on){opacity:.55}
.cl{font-size:15px;font-weight:700;margin:4px 2px}
.box{background:var(--card);border-radius:18px;padding:14px 14px 4px}
.wait{text-align:center;font-size:16px;font-weight:700;color:var(--tx2);padding:16px 8px}
/* 遊戲 */
.rdl{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;color:var(--tx2);margin:2px 2px 8px}
.jl{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
.jl .av{width:28px;height:28px;font-size:14px}
.wc{position:relative;background:linear-gradient(160deg,#fff8e6,#ffe7b3);color:#2b1b00;border-radius:22px;padding:18px 16px 22px;text-align:center;box-shadow:0 10px 30px #0008,inset 0 0 0 3px #fff6;margin:6px 0 12px}
.wc .wcat{font-size:14px;font-weight:800;color:#8a5a00;letter-spacing:1px}
.wc .ww{font-size:40px;font-weight:900;line-height:1.15;margin-top:8px;word-break:break-word}
.wc .ww.lat{font-size:34px;letter-spacing:.5px}
.st{color:#e08a00}
.ph{display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:800;margin:6px 0 4px}
.ph .cd{font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:48px;text-align:center}
.ph.up .cd{color:var(--bad)}
.bar{height:6px;border-radius:3px;background:#ffffff14;overflow:hidden;margin:0 0 12px}
.bar i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left;transform:scaleX(var(--p,1));transition:transform .25s linear}
.tip{font-size:15px;line-height:1.55;color:var(--tx2);text-align:center;margin:8px 4px}
.me-role{font-size:22px;font-weight:900;text-align:center;margin:6px 0}
.me-role.jd{color:var(--jd)}
/* 身份卡：撳住睇 */
.rc{position:relative;height:210px;border-radius:22px;margin:4px 0 12px;touch-action:none;cursor:pointer}
.rc>div{position:absolute;inset:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;transition:opacity .12s}
.rc-f{background:repeating-linear-gradient(45deg,#2f2858 0 14px,#29234d 14px 28px);box-shadow:inset 0 0 0 3px #ffffff1c;font-size:20px;font-weight:900}
.rc-f small{display:block;font-size:14px;font-weight:700;color:var(--tx2);margin-top:6px}
.rc-f .hand{width:54px;height:54px;border-radius:50%;border:3px solid var(--gold);margin-bottom:10px;position:relative}
.rc-f .hand:after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--gold);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1);opacity:1}}
.rc-b{opacity:0;pointer-events:none}
.rc.show .rc-b{opacity:1}
.rc.show .rc-f{opacity:0}
.rc-b.h{background:linear-gradient(160deg,#1f5a45,#173f33);box-shadow:inset 0 0 0 3px var(--ok)}
.rc-b.l{background:linear-gradient(160deg,#5c2134,#3e1623);box-shadow:inset 0 0 0 3px var(--bad)}
.rc-b.o{background:#2a2540;box-shadow:inset 0 0 0 3px var(--line)}
.rc-b .rl{font-size:26px;font-weight:900;margin-bottom:8px}
.rc-b.h .rl{color:var(--ok)}
.rc-b.l .rl{color:var(--bad)}
.rc-b .ex{font-size:17px;line-height:1.55;font-weight:700;overflow:auto;max-height:118px}
.rc-b .tp{font-size:14px;color:#f0eaff;margin-top:8px;opacity:.9}
/* 結果 */
.res{text-align:center;margin:6px 0 10px}
.res .big{font-size:30px;font-weight:900}
.res .big.ok{color:var(--ok)}
.res .big.bad{color:var(--bad)}
.res .who{display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:800;margin-top:8px}
.exb{background:var(--card);border-radius:18px;padding:14px 16px;margin:10px 0;box-shadow:inset 0 0 0 2px #4fe0a055}
.exb .k{font-size:14px;font-weight:800;color:var(--ok);margin-bottom:6px}
.exb .v{font-size:17px;line-height:1.6;font-weight:600}
.dl{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;flex:none;min-width:52px;text-align:right}
.dl.p{color:var(--ok)}
.dl.m{color:var(--bad)}
.sc{font-size:17px;font-weight:800;flex:none;color:var(--tx2);min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.anim .res,.anim .exb{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
.anim .exb{animation-delay:.15s}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(10px)}to{opacity:1;transform:none}}
/* 完場 */
.win{text-align:center;margin:10px 0 6px}
.crown{width:84px;height:60px;margin:0 auto}
.win .wn{font-size:30px;font-weight:900;color:var(--gold);margin-top:4px}
.win .ws{font-size:16px;color:var(--tx2);margin-top:2px}
.rk{width:30px;height:30px;border-radius:50%;background:#ffffff14;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.rk.r1{background:var(--gold);color:#2b1b00}
.rk.r2{background:#d9dff0;color:#20263a}
.rk.r3{background:#e0a36e;color:#3a1d05}
/* 彈出 */
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:#07051099;visibility:hidden;opacity:0;transition:opacity .15s}
#modal.show{visibility:visible;opacity:1}
.mb{width:100%;max-width:520px;max-height:calc(var(--app-h,100vh) - 40px);overflow-y:auto;background:var(--bg2);border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);box-shadow:0 -10px 40px #0009}
.mb h3{margin:2px 0 12px;font-size:21px;text-align:center}
.mb p{font-size:16px;line-height:1.6;margin:8px 2px}
.rules h4{font-size:17px;margin:16px 0 6px;color:var(--gold)}
.rules p,.rules li{font-size:16px;line-height:1.6}
.rules ul{margin:4px 0;padding-left:22px}
.kpd{display:flex;justify-content:center;gap:10px;margin:6px 0 16px}
.kpd span{width:58px;height:70px;border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:var(--gold);box-shadow:inset 0 0 0 2px var(--line)}
.kpd span.cur{box-shadow:inset 0 0 0 2px var(--gold)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{padding:15px 0;border-radius:14px;background:var(--card2);font-size:24px;font-weight:800}
.keys button:active{transform:scale(.95);background:var(--line)}
.keys button.s{font-size:17px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%) translateY(10px);z-index:40;background:#fff;color:#1b1530;font-weight:800;font-size:16px;padding:12px 18px;border-radius:14px;box-shadow:0 8px 30px #000a;visibility:hidden;opacity:0;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
#toast.show{visibility:visible;opacity:1;transform:translateX(-50%)}
#fx{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;pointer-events:none;visibility:hidden}
#fx.show{visibility:visible}
.fxc{background:var(--bg2);border-radius:26px;padding:26px 28px;text-align:center;box-shadow:0 0 0 4px var(--bad),0 20px 60px #000c;animation:slam .5s cubic-bezier(.2,1.6,.4,1) both;max-width:86%}
.fxc.ok{box-shadow:0 0 0 4px var(--ok),0 20px 60px #000c}
.fxc .t1{font-size:44px;font-weight:900;color:var(--bad);letter-spacing:4px}
.fxc .t2{font-size:20px;font-weight:800;margin-top:6px}
.fxc .t3{font-size:18px;font-weight:800;margin-top:8px}
@keyframes slam{from{opacity:0;transform:scale(2.2) rotate(-8deg)}to{opacity:1;transform:none}}
.cf{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:25;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(calc(var(--app-h,100vh) + 40px)) rotate(var(--r))}}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid #ffffff22;border-top-color:var(--gold);margin:30px auto 14px;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pendw .btn.pri,.pendw .sb,.pendw .seg button,.pendw .btn.line[data-act=skip]{opacity:.5;pointer-events:none}
html{touch-action:manipulation}
</style>

<script>
(() => {
'use strict';
const VER = window.__BGR_VER || 'dev';

/* ============================================================
 * 1. 工具
 * ============================================================ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 略過 */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* 略過 */ } },
};
const rid = (n) => { let s = ''; while (s.length < n) s += Math.random().toString(36).slice(2); return s.slice(0, n); };
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const cleanName = (n) => String(n || '').replace(/[\u0000-\u001f<>"'&]/g, '').trim().slice(0, 8);
const COLORS = ['#ffd166', '#86bcff', '#ff8fb0', '#8ef0a8', '#c9a0ff', '#ffa56b', '#6be3e0', '#f4ee7a', '#ff8080', '#b8c8ff'];

const ME = (() => {
  let id = LS.get('bgr_pid');
  if (typeof id !== 'string' || !/^[a-z0-9]{10}$/.test(id)) { id = rid(10); LS.set('bgr_pid', id); }
  let name = cleanName(LS.get('bgr_name'));
  if (!name) { name = '玩家' + (100 + Math.floor(Math.random() * 900)); LS.set('bgr_name', name); }
  return { id, name };
})();

let toastT = null;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}

/* ============================================================
 * 2. 連線：免費公共 MQTT 伺服器（WebSocket），自己寫嘅細客戶端
 *    （改自星翼浮島協力模式）。房號除 3 嘅餘數 ＝ 用邊個伺服器，
 *    所以入房唔使揀伺服器。網址加 ?mqtt=ws://localhost:xxxx/ 用本機測試伺服器。
 * ============================================================ */
const MQ_PREFIX = 'bgroom-q7m2/v1';
const BROKERS = (() => {
  try {
    const q = new URLSearchParams(location.search).get('mqtt');
    if (q && /^wss?:\/\/(127\.0\.0\.1|localhost)(:\d+)?\//.test(q)) return [{ name: '本機測試', url: q }];
  } catch (e) { /* 略過 */ }
  return [
    { name: '伺服器 1', url: 'wss://broker.hivemq.com:8884/mqtt' },
    { name: '伺服器 2', url: 'wss://broker.emqx.io:8084/mqtt' },
    { name: '伺服器 3', url: 'wss://test.mosquitto.org:8081/mqtt' },
  ];
})();
const _enc = new TextEncoder(), _dec = new TextDecoder();
const u8cat = (...parts) => { const n = parts.reduce((s, p) => s + p.length, 0), out = new Uint8Array(n); let o = 0; for (const p of parts) { out.set(p, o); o += p.length; } return out; };
const mqStr = (s) => { const b = typeof s === 'string' ? _enc.encode(s) : s; return u8cat(Uint8Array.of(b.length >> 8, b.length & 255), b); };
const mqLen = (n) => { const out = []; do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; out.push(d); } while (n > 0); return Uint8Array.from(out); };
const mqPacket = (first, body) => u8cat(Uint8Array.of(first), mqLen(body.length), body);

function createHub(url, prefix) {
  const PEER = rid(10);
  const raf = (f) => (typeof requestAnimationFrame === 'function' && !document.hidden ? requestAnimationFrame(f) : setTimeout(f, 30));
  let ws = null, conn = false, closed = false, buf = new Uint8Array(0), pid = 1, retry = 0, pingT = null, retryT = null, lastRx = 0;
  const rooms = new Map(), connL = new Set();
  const setConn = (v) => { if (conn === v) return; conn = v; connL.forEach((fn) => { try { fn(v); } catch (e) { console.error(e); } }); };
  const send = (bytes) => { if (ws && ws.readyState === 1) { try { ws.send(bytes); } catch (e) { /* 略過 */ } } };
  const publish = (topic, obj) => send(mqPacket(0x30, u8cat(mqStr(topic), _enc.encode(JSON.stringify(obj)))));
  const nextId = () => { pid = (pid % 65000) + 1; return Uint8Array.of(pid >> 8, pid & 255); };
  const subscribe = (filter) => send(mqPacket(0x82, u8cat(nextId(), mqStr(filter), Uint8Array.of(0))));
  const unsubscribe = (filter) => send(mqPacket(0xa2, u8cat(nextId(), mqStr(filter))));
  const byeTopic = `${prefix}/_bye/${PEER}`;

  function connect() {
    if (closed) return;
    let sock;
    try { sock = new WebSocket(url, ['mqtt']); } catch (e) { schedule(); return; }
    ws = sock; ws.binaryType = 'arraybuffer';
    sock.onopen = () => {
      const flags = 0x02 | 0x04; // 清除連線 + 斷線遺言
      send(mqPacket(0x10, u8cat(mqStr('MQTT'), Uint8Array.of(4, flags, 0, 30), mqStr('bg' + PEER), mqStr(byeTopic), mqStr('{"bye":1}'))));
    };
    sock.onmessage = (ev) => { if (ws === sock) { lastRx = Date.now(); onData(ev.data); } };
    sock.onclose = () => { if (ws !== sock) return; setConn(false); clearInterval(pingT); pingT = null; ws = null; buf = new Uint8Array(0); schedule(); };

/* 倒數：另外更新數字，唔好成個畫面重畫（WEB-27） */
function tickCd() {
  const v = S.view; if (!v || S.screen !== 'room' || !(v.ph === 'prep' || v.ph === 'talk') || !v.dl) return;
  const now = Date.now() + (S.isHost ? 0 : S.off);
  const ms = Math.max(0, v.dl - now), left = Math.ceil(ms / 1000);
  const total = v.ph === 'prep' ? PREP_MS : (v.cfg.t || 1) * 1000;
  $$('[data-cd]').forEach((e) => { const s = fmt(left); if (e.textContent !== s) e.textContent = s; });
  $$('[data-bar]').forEach((e) => e.style.setProperty('--p', Math.min(1, ms / total).toFixed(3)));
  if (v.ph === 'talk') {
    const up = ms <= 0;
    const w = $('[data-cdw]'); if (w) w.classList.toggle('up', up);
    const l = $('[data-cdl]'); if (l) { const s = up ? '時間到！判官要揀' : '講解時間'; if (l.textContent !== s) l.textContent = s; }
    const c = $('[data-cd]'); if (c && up) c.textContent = '';
    const key = 't' + v.gid + '-' + v.rd;
    if (up && !S.seen[key]) { S.seen[key] = 1; sfx('end'); }
  }
}

/* 特效：拆穿彈出、結果音效、完場彩紙；用「第幾局-第幾輪」做 key（GAME-19、GAME-20） */
let fxT = null;
function fx(prevPh, had, v) {
  if (v.bu) {
    const key = 'b' + v.gid + '-' + v.rd;
    if (!S.seen[key]) {
      S.seen[key] = 1;
      if (had) {
        const n = esc(nameOf(v, v.bu.id));
        const isL = v.bu.r === 'L';
        const html = `<div class="fxc${isL ? ' ok' : ''}"><div class="t1">拆穿！</div><div class="t2">判官拆穿 ${n}</div><div class="t3" style="color:${isL ? 'var(--ok)' : 'var(--bad)'}">${isL ? `佢真係大話精！${n} −1，判官 +1` : '原來佢係老實人！判官 −2'}</div></div>`;
        const f = $('#fx'); f.innerHTML = html; f.classList.add('show');
        clearTimeout(fxT); fxT = setTimeout(() => f.classList.remove('show'), 2600);
        sfx(isL ? 'good' : 'bad');
      }
    }
  }
  if (v.ph === 'reveal') {
    const key = 'v' + v.gid + '-' + v.rd;
    if (!S.seen[key]) { S.seen[key] = 1; if (had && prevPh !== 'reveal' && v.why !== 'bh') sfx(v.why === 'ok' ? 'good' : 'bad'); }
  }
  if (v.ph === 'end') {
    const key = 'e' + v.gid;
    if (!S.seen[key]) { S.seen[key] = 1; if (had && prevPh !== 'end') { confetti(); sfx('win'); } }
  }
  if (v.ph === 'prep') {
    const key = 'p' + v.gid + '-' + v.rd + '-' + v.sk;
    if (!S.seen[key]) { S.seen[key] = 1; S.hold = false; if (had && prevPh !== 'prep') sfx('tick'); }
  }
}
function confetti() {
  const cols = ['#ffd166', '#ff6b81', '#86bcff', '#4fe0a0', '#c9a0ff'];
  for (let i = 0; i < 60; i++) {
    const d = document.createElement('div');
    d.className = 'cf';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.background = cols[i % cols.length];
    d.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    d.style.animationDuration = (2.2 + Math.random() * 1.8) + 's';
    d.style.animationDelay = (Math.random() * 0.6) + 's';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 5000);
  }
}

function openModal(m) { S.modal = m; renderModal(); }

/* ============================================================
 * 8. 撳掣
 * ============================================================ */
document.addEventListener('click', (e) => {
  if (e.target.id === 'modal') { closeModal(); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, x = b.dataset.x, v = S.view;
  switch (a) {
    case 'create': createRoom(); break;
    case 'joinpad': S.kp = ''; openModal({ type: 'join' }); break;
    case 'kp':
      if (x === 'c') S.kp = ''; else if (x === 'b') S.kp = S.kp.slice(0, -1); else if (S.kp.length < 4) S.kp += x;
      renderModal(); break;
    case 'dojoin': if (/^\d{4}$/.test(S.kp)) { closeModal(); joinRoom(S.kp); } break;
    case 'rules': openModal({ type: 'rules' }); break;
    case 'scores': openModal({ type: 'scores' }); break;
    case 'mclose': closeModal(); break;
    case 'mok': { const m = S.modal; closeModal(); if (m && m.fn) m.fn(); break; }
    case 'cancel': leaveRoom(); break;
    case 'leave':
      if (!v) { leaveRoom(); break; }
      if (S.isHost) confirmBox('你係房主，離開會解散成個房間。', '解散房間', leaveNow, { bad: true });
      else confirmBox(v.ph === 'lobby' || v.ph === 'end' ? '離開房間？' : '遊戲進行緊，確定離開？', '離開', leaveNow, { bad: true });
      break;
    case 'share': shareLink(); break;
    case 'copy': copyText(S.code, '已複製房號'); break;
    case 'cfg': act('cfg', [b.dataset.k, +b.dataset.v]); break;
    case 'kick': if (v) confirmBox(`請 ${esc(nameOf(v, x))} 出房？佢之後入唔返呢間房。`, '請出房', () => act('kick', x), { bad: true }); break;
    case 'start': act('start'); break;
    case 'skip': act('skip'); break;
    case 'go': act('go'); break;
    case 'burst': if (v) confirmBox(`拆穿 ${esc(nameOf(v, x))}？<br><small style="font-size:15px">每輪得一次。如果佢係老實人，你會扣 2 分，呢輪即刻完。</small>`, '拆穿', () => act('burst', x), { bad: true }); break;
    case 'pick': if (v) confirmBox(`確定 ${esc(nameOf(v, x))} 係老實人？`, '確定', () => act('pick', x)); break;
    case 'next': act('next'); break;
    case 'again': act('again'); break;
    case 'redeal': closeModal(); confirmBox('重新派呢輪？會換過題目同身份，呢輪嘅分數取消。', '重新派', () => act('redeal')); break;
    case 'endgame': closeModal(); confirmBox('即刻完場？會用而家嘅分數排名。', '完場', () => act('end'), { bad: true }); break;
    case 'snd': SND.on = !SND.on; LS.set('bgr_snd', SND.on); if (!SND.on) closeAudio(); renderModal(); break;
    default: break;
  }
});
/* 身份卡：撳住先見到 */
document.addEventListener('pointerdown', (e) => {
  const c = e.target.closest('[data-hold]'); if (!c) return;
  S.hold = true; c.classList.add('show');
});
const unhold = () => { if (!S.hold) return; S.hold = false; $$('[data-hold]').forEach((c) => c.classList.remove('show')); };
window.addEventListener('pointerup', unhold);
window.addEventListener('pointercancel', unhold);
window.addEventListener('blur', unhold);

function shareUrl() {
  const u = new URL(location.href);
  u.search = ''; u.hash = '';
  const mq = new URLSearchParams(location.search).get('mqtt');
  if (mq) u.searchParams.set('mqtt', mq);
  u.searchParams.set('room', S.code);
  return u.toString();
}
async function shareLink() {
  const url = shareUrl();
  if (navigator.share) { try { await navigator.share({ title: '桌遊房', text: `嚟玩真定作！房號 ${S.code}`, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  copyText(url, '已複製入房連結');
}
async function copyText(t, msg) {
  try { await navigator.clipboard.writeText(t); toast(msg); }
  catch (e) { toast('房號：' + S.code); }
}

/* ============================================================
 * 9. 聲音（只係短音效；撳過畫面先開，離開房間就閂：WEB-01、WEB-37）
 * ============================================================ */
const SND = { ctx: null, on: LS.get('bgr_snd', true) !== false };
function unlockAudio() {
  if (!SND.on || S.screen !== 'room') return;
  try {
    if (!SND.ctx || SND.ctx.state === 'closed') SND.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (SND.ctx.state === 'suspended') SND.ctx.resume();
  } catch (e) { SND.ctx = null; }
}
function closeAudio() { if (SND.ctx) { try { SND.ctx.close(); } catch (e) { /* 略過 */ } SND.ctx = null; } }
document.addEventListener('pointerdown', unlockAudio, true);
function tone(f, t0, dur, type = 'sine', vol = 0.16) {
  const c = SND.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
}
function sfx(k) {
  if (!SND.on || !SND.ctx || SND.ctx.state !== 'running') return;
  try {
    if (k === 'tick') { tone(660, 0, 0.12); tone(880, 0.12, 0.18); }
    else if (k === 'good') { tone(523, 0, 0.16); tone(659, 0.12, 0.16); tone(784, 0.24, 0.3); }
    else if (k === 'bad') { tone(220, 0, 0.35, 'sawtooth', 0.09); tone(165, 0.18, 0.45, 'sawtooth', 0.09); }
    else if (k === 'end') { tone(880, 0, 0.18, 'square', 0.08); tone(880, 0.25, 0.18, 'square', 0.08); tone(880, 0.5, 0.35, 'square', 0.08); }
    else if (k === 'win') { [523, 659, 784, 1046].forEach((f, i) => tone(f, i * 0.13, 0.35)); }
  } catch (e) { /* 略過 */ }
}

/* ============================================================
 * 10. 手機：畫面高度、唔好熄螢幕、擋放大、返前景
 * ============================================================ */
function setAppH() { document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px'); }
function fixView() { setAppH(); [60, 250, 600, 1200].forEach((t) => setTimeout(() => { setAppH(); window.scrollTo(0, 0); }, t)); }
window.addEventListener('resize', setAppH);
window.addEventListener('orientationchange', fixView);
let wl = null;
async function wakeOn() {
  try { if ('wakeLock' in navigator && !wl && document.visibilityState === 'visible' && S.screen === 'room') { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch (e) { wl = null; }
}
function wakeOff() { try { if (wl) wl.release(); } catch (e) { /* 略過 */ } wl = null; }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') { unhold(); return; }
  fixView();
  if (S.screen === 'room') { wakeOn(); if (S.hub) S.hub.kick(); }
  else checkUpdate();
});
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('selectstart', (e) => { if (!e.target.closest || !e.target.closest('input')) e.preventDefault(); });
document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault(); });

/* ============================================================
 * 11. 自動更新：比對網上版本號，喺主頁先重新載入（WEB-07、GAME-09）
 * ============================================================ */
let newVer = null;
function checkUpdate() {
  if (location.protocol === 'file:') return;
  fetch(location.pathname + '?vcheck=' + Date.now(), { cache: 'no-store' }).then((r) => (r.ok ? r.text() : '')).then((t) => {
    const m = t.match(new RegExp('__BGR' + "_VER='([0-9A-Za-z-]+)'"));
    if (m && m[1] !== VER) { newVer = m[1]; tryReload(); }
  }).catch(() => {});
}
function tryReload() {
  if (!newVer || S.screen !== 'home' || S.modal) return;
  const k = 'bgr_reload_' + newVer;
  try { const t = +sessionStorage.getItem(k); if (t && Date.now() - t < 120000) return; sessionStorage.setItem(k, Date.now()); } catch (e) { /* 略過 */ }
  const u = new URL(location.href); u.searchParams.set('v', newVer); u.searchParams.delete('vcheck');
  location.replace(u.toString());
}

/* ============================================================
 * 12. 開始
 * ============================================================ */
fixView();
(async () => {
  const q = new URLSearchParams(location.search);
  const code = q.get('room');
  if (q.has('room') || q.has('v')) {
    const u = new URL(location.href); u.searchParams.delete('room'); u.searchParams.delete('v');
    try { history.replaceState(null, '', u.toString()); } catch (e) { /* 略過 */ }
  }
  if (code && /^\d{4}$/.test(code)) {
    const s = LS.get('bgr_sess');
    if (s && s.code === code && s.host) { if (await resume()) return; }
    joinRoom(code); return;
  }
  if (await resume()) return;
  render();
  checkUpdate();
})();

/* 測試用（Playwright）：睇到而家狀態 */
window.__bgr = { S, get HS() { return HS; }, ME, WORDS };
})();
</script>
